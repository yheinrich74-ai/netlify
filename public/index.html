function freshState() { return { step: 0, a: { technik: {}, nebenziele: [], inhalte: [], kanaele: [], vcheck: [] }, checks: {}, doors: {}, todos: {}, ai: {}, aiPlan: null, unlocked: false, code: "" }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s && s.a) return Object.assign(freshState(), s); } catch (e) {}
  return null;
}
let state = load() || freshState();
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const A = () => state.a;
const firstName = () => (A().name || "").trim();
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }

const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MO = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];
const fmt = d => `${WD[d.getDay()]}, ${d.getDate()}. ${MO[d.getMonth()]}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function seasonYear() { const t = today(); return t > new Date(t.getFullYear(), 11, 24) ? t.getFullYear() + 1 : t.getFullYear(); }

function recommendRhythm() {
  const { zeit, alltag } = A();
  if (zeit === "wenig") return "sonntage";
  if (alltag === "business") return "werktage";
  if (alltag === "eltern") return zeit === "viel" ? "taeglich" : "mix";
  return zeit === "viel" ? "taeglich" : "mix";
}

function buildDoors() {
  const y = seasonYear();
  const r = A().rhythmus || recommendRhythm();
  let dates = [];
  if (r === "sonntage") {
    const xmas = new Date(y, 11, 25);
    const fourth = addDays(xmas, -(xmas.getDay() === 0 ? 7 : xmas.getDay()));
    const set = new Map();
    [-21, -14, -7, 0].forEach(o => { const d = addDays(fourth, o); set.set(iso(d), { d, label: `${4 + o / 7}. Advent` }); });
    [[6, "Nikolaus"], [24, "Heiligabend"]].forEach(([day, label]) => { const d = new Date(y, 11, day); const k = iso(d); set.set(k, { d, label: set.has(k) ? set.get(k).label + " & " + label : label }); });
    dates = [...set.values()].sort((p, q) => p.d - q.d);
  } else {
    for (let i = 1; i <= 24; i++) {
      const d = new Date(y, 11, i);
      const we = d.getDay() === 0 || d.getDay() === 6;
      if (r === "werktage" && we) continue;
      dates.push({ d, big: r === "mix" && we });
    }
  }
  const a = A();
  const goal = a.ziel || "leads";
  let pool = (a.inhalte || []).filter(v => v !== "angebote" || goal === "umsatz");
  if (!pool.length) pool = ["tipps"];
  const base = FORMATE[a.staerke] ? FORMATE[a.staerke].short : "Text-Mail";
  const n = dates.length;
  const third = Math.max(1, Math.ceil((n - 1) / 3));
  const finaleTxt = { leads: "Abschluss-Geschenk + Einladung zu deinem nächsten Schritt", sichtbarkeit: "Mitmach-Aktion zum Teilen & Danke", launch: "Ergebnis feiern + Einladung zu deinem Angebot / zur Warteliste", bindung: "Persönliches Dankeschön + kleine Überraschung", umsatz: "Großes Finale-Angebot" }[goal];
  return dates.map((x, i) => {
    let phase = i === n - 1 ? "Finale" : i < third ? "Ankommen & schnelle Erfolge" : i < 2 * third ? "Vertiefen" : "Umsetzen";
    let content = INHALTE.find(c => c.v === pool[i % pool.length]);
    let format = base;
    if (r === "mix" && !x.big) format = "Kurz-Impuls (Text)";
    if (a.zeit === "wenig" && (a.staerke === "kamera" || a.staerke === "sprechen") && i % 2 === 1) format = "Text-Mail";
    return { n: i + 1, d: x.d, key: iso(x.d), label: x.label, big: !!x.big, finale: i === n - 1, phase, content: i === n - 1 ? { ico: "🎉", label: finaleTxt } : content, format };
  });
}

function contentPlural() {
  const first = (A().inhalte || []).find(v => v !== "angebote") || (A().inhalte || [])[0];
  const c = INHALTE.find(x => x.v === first);
  return c ? c.plural : "Impulse";
}
function shortGroup() { const a = A(); return (a.zgKurz || a.zielgruppe || "dich").trim(); }
function shortResult() {
  const a = A();
  let r = (a.ergKurz || a.versprechen || "").trim().replace(/^[.…\s]+/, "").replace(/[.!]+$/, "");
  return r || "dein Mini-Ergebnis";
}
function titleSuggestions() {
  const n = buildDoors().length, art = contentPlural(), zg = shortGroup(), erg = shortResult();
  return [
    `${n} ${art} für ${zg} – ${erg}`,
    `Dein Advents-Fahrplan: ${erg} in ${n} kleinen Schritten`,
    `Der ${n}-Türchen-Kalender für ${zg}: ${erg}`,
    `Bis Weihnachten: ${erg} – mit ${n} ${art}`
  ];
}

function score() {
  const a = A(); let s = 0;
  ["angebot", "zielgruppe", "vorher", "nachher"].forEach(k => { if ((a[k] || "").trim()) s += 5; });
  if (a.ziel) s += 10;
  if ((a.versprechen || "").trim()) s += 13;
  s += (a.vcheck || []).length * 4;
  if ((a.inhalte || []).length) s += 5;
  if (a.staerke) s += 5;
  if (a.rhythmus) s += 5;
  TECHNIK.forEach(t => { const v = (a.technik || {})[t.k]; if (v === "ja") s += 5; else if (v === "arbeit") s += 2; });
  if ((a.kanaele || []).length) s += 10;
  return Math.min(100, s);
}

/* ---------- Rendering ---------- */
function noteHtml(n) { return n ? `<div class="note ${n.cls || ""}"><strong>${n.title}</strong>${n.html}</div>` : ""; }
function optionHtml(o, pressed, multi, extra = "") {
  return `<button type="button" class="opt ${multi ? "multi" : ""}" aria-pressed="${pressed}" ${extra}>
    <span class="ico" aria-hidden="true">${o.ico || ""}</span>
    <span class="txt"><span class="lbl">${o.label}${o.rec ? '<span class="badge">Empfehlung</span>' : ""}</span>${o.desc ? `<span class="desc">${o.desc}</span>` : ""}</span>
    <span class="tick" aria-hidden="true">✓</span></button>`;
}
function progressHtml() {
  const total = STEPS.length - 1;
  const pct = Math.round((state.step / total) * 100);
  return `<div class="progress no-print"><div class="progress-meta"><strong>${STEPS[state.step].chapter}</strong><span>Schritt ${state.step} von ${total - 1}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function navHtml(step) {
  const ok = canProceed(step);
  const isLast = STEPS[state.step + 1] && STEPS[state.step + 1].kind === "result";
  return `<div class="nav no-print">
    <button type="button" class="btn ghost" data-nav="back">← Zurück</button>
    ${ok ? "" : `<span class="help">${missingHint(step)}</span>`}
    <button type="button" class="btn ${isLast ? "pink" : ""}" data-nav="next" ${ok ? "" : "disabled"}>${isLast ? "Meinen Plan erstellen ✨" : "Weiter →"}</button>
  </div>`;
}

function renderGate() {
  $app.innerHTML = `<section class="card" style="max-width:520px;text-align:center">
    <span class="eyebrow">Willkommen</span>
    <h1>Dein Zugang</h1>
    <p>Bitte gib den Zugangscode aus deiner Kaufbestätigung ein.</p>
    <form id="gate"><div class="field"><label for="code">Zugangscode</label><input type="text" id="code" autocomplete="off" placeholder="Zugangscode"></div>
    <button class="btn pink" type="submit">Los geht's</button></form></section>`;
  document.getElementById("gate").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    const code = document.getElementById("code").value.trim();
    if (!code) return;
    btn.disabled = true;
    try {
      await api({ mode: "check" }, code);
      state.unlocked = true; state.code = code; save(); render();
    } catch (err) {
      toast(err.message);
      btn.disabled = false;
    }
  });
}

function renderFields(step) {
  return `${step.pre ? noteHtml(step.pre) : ""}${step.fields.map(f => `<div class="field">
      <label for="f-${f.key}">${f.label}</label>
      ${f.single ? `<input type="text" id="f-${f.key}" data-field="${f.key}" value="${esc(A()[f.key])}" placeholder="${esc(f.placeholder)}">`
                 : `<textarea id="f-${f.key}" data-field="${f.key}" placeholder="${esc(f.placeholder)}">${esc(A()[f.key])}</textarea>`}
    </div>`).join("")}${noteHtml(step.note)}`;
}

function renderSingle(step) {
  const rec = step.recommend ? recommendRhythm() : null;
  return `<div class="options">${step.options.map(o => optionHtml({ ...o, rec: o.v === rec }, A()[step.key] === o.v, false, `data-single="${step.key}" data-v="${o.v}"`)).join("")}</div>
    ${rec ? `<p class="help" style="color:var(--muted);font-size:.95rem">Unsere Empfehlung basiert auf deiner verfügbaren Zeit und dem Alltag deiner Zielgruppe – du entscheidest.</p>` : ""}${noteHtml(step.note)}`;
}

function renderMulti(step) {
  const sel = A()[step.key] || [];
  const opts = step.excludeKey ? step.options.filter(o => o.v !== A()[step.excludeKey]) : step.options;
  return `<div class="options cols-2">${opts.map(o => optionHtml(o, sel.includes(o.v), true, `data-multi="${step.key}" data-v="${o.v}"`)).join("")}</div>${noteHtml(step.note)}`;
}

function renderCheck(step) {
  const ans = state.checks[step.id];
  return `<p class="lead"><strong>${step.question}</strong></p>
    <div class="options">${step.options.map(o => {
      let cls = "";
      if (ans) cls = o.v === step.correct ? "correct" : o.v === ans ? "wrong" : "";
      return `<button type="button" class="opt ${cls}" ${ans ? "disabled" : ""} data-check="${step.id}" data-v="${o.v}"><span class="txt"><span class="lbl">${o.label}</span></span>${ans && o.v === step.correct ? '<span aria-hidden="true">✅</span>' : ""}</button>`;
    }).join("")}</div>
    ${ans ? `<div class="note ${ans === step.correct ? "ok" : "warn"}"><strong>${ans === step.correct ? "Richtig! 🎉" : "Fast! Die richtige Antwort ist markiert."}</strong>${step.explain}</div>` : ""}`;
}

      <div class="field"><label for="f-ergKurz">Mini-Ergebnis in Kurzform</label><input type="text" id="f-ergKurz" data-field="ergKurz" data-live="sugg" value="${esc(a.ergKurz != null ? a.ergKurz : "")}" placeholder="z. B. entspannt ins neue Jahr starten"></div>

function suggHtml() { return titleSuggestions().map(s => `<button type="button" data-title="${esc(s)}">${esc(s)}</button>`).join(""); }

function renderStep() {
  const step = STEPS[state.step];
  if (step.kind === "intro") { $app.innerHTML = renderIntro(); return; }
  if (step.kind === "result") { $app.innerHTML = renderResult(); return; }
  let body = "";
  if (step.kind === "fields" || step.kind === "single" || step.kind === "multi" || step.kind === "check") {
    body = `<span class="eyebrow">${step.chapter}</span><h2>${step.title}</h2>${step.lead ? `<p class="lead">${step.lead}</p>` : ""}`;
  }
  body += ({ fields: renderFields, single: renderSingle, multi: renderMulti, check: renderCheck, versprechen: renderVersprechen, technik: renderTechnik, titel: renderTitel })[step.kind](step);
  $app.innerHTML = progressHtml() + `<section class="card">${body}${navHtml(step)}</section>`;
}

/* ---------- Result ---------- */

  if (a.zeit === "wenig" && (r === "taeglich" || r === "mix")) t.push("⏳ Du hast wenig Zeit, aber einen dichten Rhythmus gewählt. Überleg, ob Adventssonntage oder Werktage reichen – oder bereite alle Inhalte bis Mitte November komplett vor.");
  if (a.alltag === "business" && (r === "taeglich" || r === "mix")) t.push("💼 Deine Zielgruppe ist am Wochenende eher offline. Mach Samstag und Sonntag zu kurzen Bonus-Türchen oder setze nur auf Montag bis Freitag.");
  if (a.alltag === "eltern") t.push("🧸 Halte jedes Türchen unter drei Minuten Lese-, Hör- oder Sehzeit. Eine klare Mini-Aufgabe pro Tag schlägt jeden langen Text.");
  if (a.alltag === "berufstaetig") t.push("🚆 Verschicke deine Türchen früh morgens (ca. 6–7 Uhr) – perfekt für Kaffee oder Bahnfahrt. Audio funktioniert unterwegs besonders gut.");
  if (a.alltag === "musse") t.push("☕ Deine Zielgruppe mag Tiefe: Gönn dir am Wochenende ausführlichere Inhalte oder ein kleines Live-Element.");
  if (a.staerke === "kamera" && a.zeit !== "viel") t.push("🎬 Videos kosten Zeit. Nimm alle an ein bis zwei Tagen im Block auf – dein Plan wechselt bereits Video- und Text-Türchen ab.");
  if (a.staerke === "gestalten") t.push("🎨 Erstelle ein Vorlagen-Design für alle Downloads (z. B. in Canva) – dann tauschst du pro Türchen nur noch den Inhalt.");
  ({
    leads: ["📬 Im letzten Türchen lädst du zu deinem nächsten Schritt ein – Erstgespräch, Warteliste oder Einstiegsangebot. Freundlich, nicht drängelnd.", "📨 Plane nach dem letzten Türchen eine kleine Follow-up-Mail, damit deine neuen Kontakte im Januar nicht „kalt“ werden."],
    sichtbarkeit: ["✨ Mach Türchen teilbar: kleine Story-Grafiken, eine Mitmach-Aufgabe mit eigenem Hashtag oder ein „Leite das an eine Freundin weiter“."],
    launch: ["🚀 Lass deine Türchen genau zu dem Problem führen, das dein Angebot löst. In der letzten Woche darfst du deine Warteliste erwähnen."],
    bindung: ["💛 Mach es exklusiv: persönliche Ansprache, kleine Überraschungen, ein ehrliches Danke. In der letzten Woche passt eine Bitte um Feedback oder ein Testimonial."],
    umsatz: ["🛍️ Tägliche Angebote funktionieren vor allem mit Produkten. Bei Dienstleistungen lieber Mehrwert-Türchen plus ein Angebot an ausgewählten Tagen."]
  })[a.ziel || "leads"].forEach(x => t.push(x));
  if (a.versand === "insta") t.push("📸 Nur auf Instagram erreichst du nur die Menschen, die der Algorithmus zufällig ausspielt – und du gewinnst keine Kontakte für die Zeit nach Weihnachten. Überleg, ob du die Türchen nicht doch per Mail verschickst und Instagram als Schaufenster nutzt.");
  const tech = a.technik || {};
  if (a.versand !== "insta" && tech.newsletterTool !== "ja") t.push("🛠️ Ohne E-Mail-Marketing-Tool geht es nicht. Entscheide dich zuerst für ein Tool – erst dann lohnt sich Landingpage und Automation.");
  if (tech.doi !== "ja") t.push("🔐 Denk an das Double-Opt-in: Es ist in Deutschland Pflicht für Newsletter-Anmeldungen und schützt deine Liste vor Fake-Adressen.");
  if ((a.kanaele || []).includes("koop") || (a.inhalte || []).includes("gast")) t.push("🤝 Frag zwei bis drei Business-Buddies nach Gast-Türchen – sie teilen den Kalender dann auch mit ihrer Community.");
  t.push("🌱 Fang klein an: Ein persönlicher Kalender mit Herz schlägt einen perfekten Kalender, der nie fertig wird. Ausbauen kannst du im nächsten Jahr.");
  return t;
}

function buildTimeline(doors) {
  const a = A(), tech = a.technik || {}, fd = doors[0].d, last = doors[doors.length - 1].d, mid = doors[Math.floor(doors.length / 2)].d;
  return [
    { id: "titel", d: addDays(fd, -45), what: "Titel und Ergebnis-Versprechen festlegen (✓ dank diesem Kompass)" },
    { id: "themen", d: addDays(fd, -40), what: `Themen für alle ${doors.length} Türchen in Stichworten notieren (nutze den Fahrplan unten)` },
    { id: "tool", d: addDays(fd, -38), what: "E-Mail-Marketing-Tool startklar machen", done: tech.newsletterTool === "ja" },
    { id: "landing", d: addDays(fd, -36), what: "Landingpage mit Anmeldeformular und Double-Opt-in einrichten", done: tech.landingpage === "ja" && tech.doi === "ja" },
    { id: "welcome", d: addDays(fd, -35), what: "Willkommensmail schreiben – die Türchen-Automation ergänzt du später", done: tech.willkommensmail === "ja" },
    { id: "promo", d: addDays(fd, -35), what: "Bewerbung starten – Promo-Plan siehe unten" },
    { id: "content1", d: addDays(fd, -14), what: "Erste Hälfte der Türchen fertig vorbereiten" },
    { id: "auto", d: addDays(fd, -5), what: "Türchen-Automation einrichten und mit einer Testadresse komplett durchklicken" },
    { id: "countdown", d: addDays(fd, -3), what: "Countdown-Posts & Erinnerungsmail: „Gleich geht's los!“" },
    { id: "live", d: fd, what: "Türchen 1 öffnet sich 🎉 – feiere dich!" },
    { id: "halbzeit", d: mid, what: "Halbzeit-Check: Öffnungsraten ansehen, Feedback sammeln" },
    { id: "follow", d: addDays(last, 3), what: "Follow-up-Mail & Auswertung: neue Kontakte, Öffnungen, Klicks, Anfragen" }
  ];
}

    <div class="legend"><span><i style="background:var(--blush)"></i>Türchen</span>${a.rhythmus === "mix" ? '<span><i style="background:var(--ink-strong)"></i>Großes Wochenend-Türchen</span>' : ""}<span><i style="background:var(--pink)"></i>Finale</span></div>
    <div class="door-grid">${doors.map(d => `<article class="door ${d.finale ? "finale" : ""} ${d.big ? "big" : ""}">
      <header><span class="num">${d.n}</span><div><div class="date">${fmt(d.d)}${d.label ? ` · ${d.label}` : ""}</div><div class="phase">${d.phase}</div></div></header>
      <div class="meta">${d.content.ico} ${d.content.label}<br>📨 ${d.format}</div>
      <input type="text" data-door="${d.key}" value="${esc(state.doors[d.key])}" placeholder="Thema für Türchen ${d.n}" aria-label="Thema für Türchen ${d.n}">
    </article>`).join("")}</div>
  </section>

  <section class="section" id="ai-section">${aiSectionHtml(doors)}</section>

  <section class="section">
    <h2>📆 Dein Zeitplan bis zum Start</h2>
    <p>Hake ab, was erledigt ist. Termine, die schon vorbei sind, sind mit <strong>Jetzt</strong> markiert.</p>
    <ul class="timeline">${timeline.map(x => {
      const done = state.todos[x.id] != null ? state.todos[x.id] : !!x.done;
      const past = x.d < t0 && x.id !== "follow" && x.id !== "halbzeit" && x.id !== "live";
      return `<li class="${done ? "done" : ""}"><input type="checkbox" data-todo="${x.id}" ${done ? "checked" : ""} aria-label="${esc(x.what)} erledigt">
        <span class="when">${past && !done ? '<span class="now">Jetzt</span>' : fmt(x.d)}</span><span class="what">${x.what}</span></li>`;
    }).join("")}</ul>
  </section>

  <section class="section">
    <h2>📣 Dein Social-Media-Promo-Plan</h2>
    <p>Vier Wochen, vier Schwerpunkte – so baust du Vorfreude auf, ohne zu nerven.</p>
    <div class="weeks">${weeks.map((w, i) => {
      const s = addDays(fd, -28 + i * 7), e = addDays(s, 6);
      return `<div class="week"><h3>Woche ${i + 1}: ${w.t}</h3><small>${fmt(s)} – ${fmt(e)}</small><ul>${w.tips.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
    }).join("")}</div>
    ${chosen.length ? `<h3 style="margin-top:22px">Ideen für deine Kanäle</h3><div class="channels">${chosen.map(k => `<div class="channel"><h3>${k.ico} ${k.label}</h3><ul>${k.ideas.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}
    <h3 style="margin-top:22px">Deine Caption-Vorlage</h3>
    <p>Kopiere sie, passe sie an deine Sprache an – und los geht's.</p>
    <pre class="caption" id="caption">${esc(buildCaption(doors))}</pre>
    <button type="button" class="btn small no-print" data-nav="caption">Caption kopieren</button>
  </section>

  <section class="section" style="text-align:center">
    <p class="script">Du schaffst das!</p>
    <p>Dein Kalender muss nicht perfekt sein. Er lebt davon, dass er persönlich ist – und dass er wirklich bei deinen Menschen ankommt.</p>
    <div class="actions no-print"><button type="button" class="btn ghost" data-nav="restart">Neuen Kalender planen</button></div>
  </section>`;
}

function planAsText() {
  const a = A(), doors = buildDoors(), typ = TYPEN[a.ziel || "leads"];
  const lines = [
    "MEIN ADVENTSKALENDER-PLAN (Your Help · Adventskalender-Kompass)", "",
    `Typ: ${typ.name}`, `Titel: ${a.titel || titleSuggestions()[0]}`,
    `Versprechen: Nach dem letzten Türchen ${(a.versprechen || "–").replace(/^[.…\s]+/, "")}`,
    `Zielgruppe: ${a.zielgruppe || "–"}`, `Format: ${FORMATE[a.staerke] ? FORMATE[a.staerke].short : "–"}`,
    `Rhythmus: ${RHYTHMEN[a.rhythmus || recommendRhythm()].label} (${doors.length} Türchen)`, "", "TÜRCHEN-FAHRPLAN"
  ];
  doors.forEach(d => lines.push(`${d.n}. ${fmt(d.d)} – ${d.content.label} – ${d.format}${state.doors[d.key] ? " – " + state.doors[d.key] : ""}`));
  lines.push("", "ZEITPLAN");
  buildTimeline(doors).forEach(x => lines.push(`[${(state.todos[x.id] != null ? state.todos[x.id] : x.done) ? "x" : " "}] ${fmt(x.d)} – ${x.what}`));
  lines.push("", "EMPFEHLUNGEN");
  buildTips(doors).forEach(t => lines.push("• " + t));
  const ai = aiAllText();
  if (ai) lines.push("", "TÜRCHEN-INHALTE", "", ai);
  return lines.join("\n");
}

async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg); } catch (err) { toast("Kopieren nicht möglich – bitte manuell markieren."); }
    ta.remove();
  }
}

/* ---------- KI-Türchen-Generator ---------- */
const BATCH_SIZE = 4;
const PARALLEL = 3;
let aiBusy = false;
const aiLoading = new Set();

async function api(payload, code = state.code) {
  let res;
  try {
    res = await fetch(API_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...payload, code }) });
  } catch (e) {
    throw new Error("Keine Verbindung. Bitte prüfe dein Internet und versuche es noch einmal.");
  }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { state.unlocked = false; save(); }
  if (!res.ok) throw new Error(data.error || "Die KI ist gerade nicht erreichbar. Bitte versuche es gleich noch einmal.");
  return data;
}

function aiProfile() {
  const a = A(), lbl = (list, v) => (list.find(x => x.v === v) || {}).label || "";
  return {
    "Angebot": a.angebot, "Zielgruppe": a.zielgruppe, "Wo die Wunschkundin heute steht": a.vorher, "Wo sie nach der Zusammenarbeit steht": a.nachher,
    "Hauptziel des Kalenders": lbl(ZIELE, a.ziel), "Nebenziele": (a.nebenziele || []).map(v => lbl(ZIELE, v)),
    "Alltag der Zielgruppe im Dezember": lbl(ALLTAG, a.alltag), "Größter Stolperstein oder Wunsch": a.pain, "Erster kleiner Schritt": a.ersterSchritt,
    "Ergebnis-Versprechen (nach dem letzten Türchen …)": a.versprechen, "Gewählte Inhaltsarten": (a.inhalte || []).map(v => lbl(INHALTE, v)),
    "Stärke der Kalender-Macherin": FORMATE[a.staerke] ? FORMATE[a.staerke].label : "", "Versand": lbl(VERSAND, a.versand),
    "Kalender-Titel": a.titel || titleSuggestions()[0]
  };
}

function doorInfo(d) {
  return { n: d.n, datum: fmt(d.d) + (d.label ? " (" + d.label + ")" : ""), phase: d.phase, inhaltsart: d.content.label, format: d.format, thema: (state.doors[d.key] || "").trim() || undefined };
}

function applyAiDoor(d, r) {
  state.ai[d.key] = { titel: r.titel, text: r.text, aufgabe: r.aufgabe, betreff: r.betreff, story: r.story };
  if (!(state.doors[d.key] || "").trim()) {
    state.doors[d.key] = r.titel;
    const input = document.querySelector(`[data-door="${d.key}"]`);
    if (input) input.value = r.titel;
  }
}

function refreshAiDoor(d) {
  const el = document.getElementById("ai-" + d.key);
  if (el) { const open = el.open; el.outerHTML = aiDoorHtml(d); if (open) document.getElementById("ai-" + d.key).open = true; }
}

function setAiStatus(html) { const el = document.getElementById("ai-status"); if (el) el.innerHTML = html; }

async function generateAll() {
  if (aiBusy) return;
  aiBusy = true;
  const doors = buildDoors();
  const todo = doors.filter(d => !state.ai[d.key]);
  todo.forEach(d => aiLoading.add(d.key));
  document.getElementById("ai-section").innerHTML = aiSectionHtml(doors);
  let done = doors.length - todo.length, failed = null;
  const progress = () => setAiStatus(`<div class="ai-progress"><span class="spinner" aria-hidden="true"></span> Die KI schreibt deine Türchen … <strong>${done} von ${doors.length}</strong> fertig</div><div class="bar"><i style="width:${Math.round(done / doors.length * 100)}%"></i></div>`);
  try {
    if (!state.aiPlan || state.aiPlan.length !== doors.length) {
      setAiStatus(`<div class="ai-progress"><span class="spinner" aria-hidden="true"></span> Die KI plant die Themen für alle ${doors.length} Türchen …</div>`);
      const plan = await api({ mode: "plan", profile: aiProfile(), doors: doors.map(doorInfo) });
      state.aiPlan = plan.doors; save();
      state.aiPlan.forEach(p => { const d = doors[p.n - 1]; if (d && !(state.doors[d.key] || "").trim()) { state.doors[d.key] = p.titel; const input = document.querySelector(`[data-door="${d.key}"]`); if (input) input.value = p.titel; } });
    }
    progress();
    const batches = [];
    for (let i = 0; i < todo.length; i += BATCH_SIZE) batches.push(todo.slice(i, i + BATCH_SIZE));
    const worker = async () => {
      while (batches.length && !failed) {
        const batch = batches.shift();
        try {
          const res = await api({ mode: "doors", profile: aiProfile(), plan: state.aiPlan, doors: batch.map(doorInfo) });
          (res.doors || []).forEach(r => { const d = batch.find(x => x.n === r.n); if (d) applyAiDoor(d, r); });
          save();
        } catch (e) { failed = e; }
        batch.forEach(d => { aiLoading.delete(d.key); if (state.ai[d.key]) done++; refreshAiDoor(d); });
        progress();
      }
    };
    await Promise.all(Array.from({ length: PARALLEL }, worker));
    if (failed) throw failed;
    setAiStatus(`<div class="note ok"><strong>Fertig! 🎉</strong>Alle ${doors.length} Türchen sind geschrieben. Lies sie in Ruhe durch und passe sie an deine Sprache an – du kannst direkt in die Felder tippen.</div>`);
  } catch (e) {
    setAiStatus(`<div class="note warn"><strong>Das hat nicht ganz geklappt</strong>${esc(e.message)} Bereits fertige Türchen bleiben gespeichert. Klick einfach noch einmal auf „Fehlende Türchen erstellen“.</div>`);
  } finally {
    aiBusy = false;
    aiLoading.clear();
    buildDoors().forEach(refreshAiDoor);
    const actions = document.getElementById("ai-actions");
    if (actions) actions.outerHTML = aiActionsHtml(buildDoors());
  }
}

async function regenerateDoor(key) {
  const d = buildDoors().find(x => x.key === key);
  if (!d || aiLoading.has(key)) return;
  aiLoading.add(key); refreshAiDoor(d);
  try {
    const res = await api({ mode: "doors", profile: aiProfile(), plan: state.aiPlan || [], doors: [doorInfo(d)] });
    const r = (res.doors || [])[0];
    if (r) { applyAiDoor(d, r); save(); }
  } catch (e) { toast(e.message); }
  aiLoading.delete(key); refreshAiDoor(d);
  const el = document.getElementById("ai-" + key); if (el) el.open = true;
}

function aiActionsHtml(doors) {
  const count = doors.filter(d => state.ai[d.key]).length;
  const all = count === doors.length;
  return `<div class="actions ai-actions no-print" id="ai-actions" style="justify-content:flex-start">
    ${all ? "" : `<button type="button" class="btn pink" data-nav="ai-all" ${aiBusy ? "disabled" : ""}>✨ ${count ? "Fehlende Türchen erstellen" : "Alle Türchen-Inhalte mit KI erstellen"}</button>`}
    ${count ? `<button type="button" class="btn" data-nav="ai-copy-all">📋 Alle Inhalte kopieren</button>
    <button type="button" class="btn ghost" data-nav="ai-csv">⬇️ Als Tabelle (CSV)</button>
    <button type="button" class="btn ghost" data-nav="ai-reset" ${aiBusy ? "disabled" : ""}>↻ Alles neu erstellen</button>` : ""}
  </div>`;
}

function aiSectionHtml(doors) {
  const a = A();
  const story = a.versand === "insta" ? "Story-Text" : "Mail-Text, Betreff, Mini-Aufgabe und Story-Text";
  return `<h2>✨ Deine Türchen-Inhalte</h2>
    <p>Die KI schreibt dir für jedes Türchen den kompletten Inhalt – ${story} – passend zu deinem Thema, deiner Zielgruppe und deinem Versprechen. Das dauert ein bis zwei Minuten. Danach kannst du alles direkt hier bearbeiten oder einzelne Türchen neu vorschlagen lassen.</p>
    ${aiActionsHtml(doors)}
    <div id="ai-status" aria-live="polite"></div>
    <div class="ai-list">${doors.map(aiDoorHtml).join("")}</div>
    <p class="ai-hint">Die Texte sind ein starker Entwurf, kein Endprodukt: Lies jedes Türchen einmal laut und ergänze deine eigenen Beispiele und Erfahrungen. Genau das macht deinen Kalender persönlich.</p>`;
}

function aiDoorHtml(d) {
  const r = state.ai[d.key], loading = aiLoading.has(d.key);
  const field = (f, label, rows) => `<div class="field"><label for="ai-${d.key}-${f}">${label}</label>${rows
    ? `<textarea id="ai-${d.key}-${f}" data-ai="${d.key}|${f}" rows="${rows}">${esc(r[f])}</textarea>`
    : `<input type="text" id="ai-${d.key}-${f}" data-ai="${d.key}|${f}" value="${esc(r[f])}">`}</div>`;
  const status = loading ? '<span class="spinner" aria-hidden="true"></span> wird geschrieben …' : r ? "fertig" : "noch offen";
  return `<details class="ai-door ${r ? "has" : ""}" id="ai-${d.key}">
    <summary><span class="num">${d.n}</span><span class="sum-txt"><b>${esc(r ? r.titel : (state.doors[d.key] || "Türchen " + d.n))}</b><small>${fmt(d.d)} · ${d.content.label} · ${status}</small></span></summary>
    <div class="ai-body">${r ? `
      ${field("titel", "Überschrift")}
      ${field("betreff", "E-Mail-Betreff")}
      ${field("text", "Inhalt des Türchens", 8)}
      ${field("aufgabe", "Mini-Aufgabe des Tages", 2)}
      ${field("story", "Instagram-Story", 2)}
      <div class="actions no-print" style="justify-content:flex-start;margin:4px 0 0">
        <button type="button" class="btn small" data-nav="ai-copy-one" data-key="${d.key}">Kopieren</button>
        <button type="button" class="btn small ghost" data-nav="ai-one" data-key="${d.key}" ${loading ? "disabled" : ""}>↻ Neu vorschlagen</button>
      </div>` : `<p style="margin:0">${loading ? "Die KI schreibt gerade an diesem Türchen …" : "Noch kein Inhalt. Trag oben im Fahrplan gern ein Wunsch-Thema ein – die KI richtet sich danach."}</p>
      ${loading ? "" : `<button type="button" class="btn small ghost no-print" data-nav="ai-one" data-key="${d.key}" style="margin-top:10px">✨ Nur dieses Türchen erstellen</button>`}`}
    </div>
  </details>`;
}

function aiDoorText(d) {
  const r = state.ai[d.key];
  if (!r) return "";
  return `TÜRCHEN ${d.n} – ${fmt(d.d)}\nBetreff: ${r.betreff}\n\n${r.titel}\n\n${r.text}\n\nMini-Aufgabe: ${r.aufgabe}\n\nInstagram-Story: ${r.story}`;
}
function aiAllText() { return buildDoors().filter(d => state.ai[d.key]).map(aiDoorText).join("\n\n――――――――――\n\n"); }

function downloadCsv() {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = [["Türchen", "Datum", "Betreff", "Überschrift", "Inhalt", "Mini-Aufgabe", "Instagram-Story"]];
  buildDoors().forEach(d => { const r = state.ai[d.key]; if (r) rows.push([d.n, iso(d.d), r.betreff, r.titel, r.text, r.aufgabe, r.story]); });
  const blob = new Blob(["﻿" + rows.map(r => r.map(q).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "adventskalender-tuerchen.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(d => { d.open = true; }));

function render() {
  if (ZUGANGSCODE_PFLICHT && !state.unlocked) { renderGate(); return; }
  renderStep();
}
function go(to) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, to));
  save(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
  const h = $app.querySelector("h1, h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}

/* ---------- Events ---------- */
$app.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  const a = A(), ds = el.dataset;
  if (ds.single) { a[ds.single] = ds.v; save(); renderStep(); return; }
  if (ds.multi) { const arr = a[ds.multi] = a[ds.multi] || []; const i = arr.indexOf(ds.v); i > -1 ? arr.splice(i, 1) : arr.push(ds.v); save(); renderStep(); return; }
  if (ds.check) { if (!state.checks[ds.check]) { state.checks[ds.check] = ds.v; save(); renderStep(); } return; }
  if (ds.tech) { a.technik = a.technik || {}; a.technik[ds.tech] = ds.v; save(); renderStep(); return; }
  if (ds.title) { a.titel = ds.title; save(); const f = document.getElementById("f-titel"); f.value = ds.title; f.focus(); return; }
  switch (ds.nav) {
    case "next": if (canProceed(STEPS[state.step])) go(state.step + 1); break;
    case "back": go(state.step - 1); break;
    case "edit": go(1); break;
    case "restart": if (confirm("Alle Antworten löschen und neu beginnen?")) { const { unlocked, code } = state; state = freshState(); Object.assign(state, { unlocked, code }); save(); go(0); } break;
    case "ai-all": generateAll(); break;
    case "ai-reset": if (confirm("Alle KI-Inhalte löschen und komplett neu erstellen lassen?")) { state.ai = {}; state.aiPlan = null; save(); generateAll(); } break;
    case "ai-one": regenerateDoor(ds.key); break;
    case "ai-copy-one": copyText(aiDoorText(buildDoors().find(d => d.key === ds.key)), "Türchen kopiert ✓"); break;
    case "ai-copy-all": copyText(aiAllText(), "Alle Türchen-Inhalte kopiert ✓"); break;
    case "ai-csv": downloadCsv(); break;
    case "print": window.print(); break;
    case "copy": copyText(planAsText(), "Plan kopiert ✓"); break;
    case "caption": copyText(document.getElementById("caption").textContent, "Caption kopiert ✓"); break;
  }
});
$app.addEventListener("input", e => {
  const el = e.target, a = A();
  if (el.dataset.field) {
    a[el.dataset.field] = el.value; save();
    if (el.dataset.live === "sugg") document.getElementById("sugg").innerHTML = suggHtml();
  }
  if (el.dataset.door) { state.doors[el.dataset.door] = el.value; save(); }
  if (el.dataset.ai) { const [key, field] = el.dataset.ai.split("|"); if (state.ai[key]) { state.ai[key][field] = el.value; save(); } }
});
$app.addEventListener("change", e => {
  const el = e.target, a = A();
  if (el.dataset.vcheck) { const arr = a.vcheck = a.vcheck || []; const i = arr.indexOf(el.dataset.vcheck); el.checked ? (i < 0 && arr.push(el.dataset.vcheck)) : (i > -1 && arr.splice(i, 1)); save(); }
  if (el.dataset.todo) { state.todos[el.dataset.todo] = el.checked; save(); el.closest("li").classList.toggle("done", el.checked); }
});
$app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches('input[type="text"]') && e.target.closest(".card")) {
    const next = $app.querySelector('[data-nav="next"]:not([disabled])'); if (next) { e.preventDefault(); next.click(); }
  }
});

render();
</script>
